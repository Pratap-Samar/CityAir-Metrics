name: CityAir Metrics CI

on:
  push:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cityair_user
          POSTGRES_PASSWORD: cityair_password
          POSTGRES_DB: cityair
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cityair_user -d cityair"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_USER: cityair_user
      POSTGRES_PASSWORD: cityair_password
      POSTGRES_DB: cityair

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database schema
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" psql \
            -h localhost \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -f database/schema.sql

      - name: Run tests
        run: |
          python -m pytest tests/

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: cityair-backend:ci

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: cityair-frontend:ci

      - name: Build Airflow Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/airflow.Dockerfile
          push: false
          tags: cityair-airflow:ci

      - name: Verify Airflow DAG Import
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/dags:/opt/airflow/dags \
            -v ${{ github.workspace }}/ingestion:/opt/airflow/ingestion \
            cityair-airflow:ci \
            python -c "from airflow.models import DagBag; d = DagBag('/opt/airflow/dags'); assert not d.import_errors, f'DAG import errors: {d.import_errors}'; assert 'cityair_hourly_ingestion' in d.dags"
